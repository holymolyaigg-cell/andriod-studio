name: Download Android Studio
on: [workflow_dispatch] # این workflow را دستی اجرا می‌کنید

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download file with wget
        run: |
          wget https://edgedl.me.gvt1.com/android/studio/install/2026.2.1.8/android-studio-rabbit1-windows.exe -O android-studio.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-studio-installer
          path: android-studio.exe
